<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스네이크 게임</title>
    <!-- Tailwind CSS (CDN 방식으로 불러오기) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 모바일 터치 시 기본 동작(스크롤, 확대 등) 방지 */
        body { touch-action: none; }
        
        /* 캔버스 픽셀을 또렷하게 렌더링하기 위함 (선택사항) */
        canvas { image-rendering: pixelated; }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4 font-sans select-none">

    <div class="max-w-md w-full">
        <!-- 헤더 및 점수 -->
        <div class="flex justify-between items-end mb-4">
            <div>
                <h1 class="text-3xl font-bold text-green-400 mb-2">스네이크</h1>
                <!-- 속도(난이도) 선택 버튼 -->
                <div class="flex space-x-2 bg-gray-800 p-1 rounded-lg">
                    <button id="btn-slow" onclick="setDifficulty('slow')" class="px-3 py-1 text-sm font-medium rounded-md transition-colors duration-200">느림</button>
                    <button id="btn-normal" onclick="setDifficulty('normal')" class="px-3 py-1 text-sm font-medium rounded-md transition-colors duration-200">보통</button>
                    <button id="btn-fast" onclick="setDifficulty('fast')" class="px-3 py-1 text-sm font-medium rounded-md transition-colors duration-200">빠름</button>
                </div>
            </div>
            
            <div class="flex flex-col items-end gap-2">
                <!-- 최고 점수 표시 영역 -->
                <div class="text-sm font-semibold bg-gray-800 px-3 py-1 rounded-lg shadow-inner text-gray-400">
                    최고 기록: <span id="highScore" class="text-blue-400">0</span>
                </div>
                <!-- 현재 점수 표시 영역 -->
                <div class="text-xl font-semibold bg-gray-800 px-4 py-2 rounded-lg shadow-inner flex flex-col items-end border border-gray-700">
                    <span class="text-xs text-gray-500 mb-1" id="pointsIndicator">+10점/개</span>
                    <div>현재 점수: <span id="score" class="text-yellow-400 font-bold">0</span></div>
                </div>
            </div>
        </div>

        <!-- 게임 화면 컨테이너 -->
        <div class="relative bg-gray-800 rounded-xl shadow-2xl p-2 border border-gray-700">
            <!-- 캔버스 (게임이 그려지는 곳) -->
            <canvas id="gameCanvas" width="400" height="400" class="w-full h-auto bg-gray-950 rounded-lg shadow-inner"></canvas>
            
            <!-- 게임 오버 오버레이 -->
            <div id="gameOverScreen" class="absolute inset-0 bg-black/80 rounded-xl flex flex-col items-center justify-center hidden backdrop-blur-sm transition-opacity duration-300 z-10">
                <h2 class="text-4xl font-extrabold text-red-500 mb-2 drop-shadow-md">게임 오버!</h2>
                <p class="text-lg text-gray-300 mb-2">최종 점수: <span id="finalScore" class="text-yellow-400 font-bold">0</span></p>
                <p id="newRecordMsg" class="text-blue-400 font-bold mb-6 hidden animate-bounce">🎉 신기록 달성! 🎉</p>
                
                <button onclick="resetGame()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 text-lg mt-2">
                    다시 시작
                </button>
            </div>
            
            <!-- 시작 안내 오버레이 -->
            <div id="startScreen" class="absolute inset-0 bg-black/60 rounded-xl flex flex-col items-center justify-center backdrop-blur-sm z-10">
                <p class="text-green-400 text-xl font-bold mb-4 animate-pulse">방향키를 눌러 시작하세요</p>
                <p class="text-gray-400 text-sm text-center px-6">모바일은 하단 버튼이나 스와이프를 사용하세요.</p>
            </div>
        </div>

        <!-- 모바일 조작 버튼 (D-Pad) -->
        <div class="mt-6 grid grid-cols-3 gap-2 max-w-[200px] mx-auto md:hidden">
            <div></div>
            <!-- 위로 -->
            <button class="bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white p-4 rounded-xl flex justify-center items-center shadow-lg active:scale-95 transition-transform touch-none" onmousedown="setDirection(0, -1)" ontouchstart="setDirection(0, -1); event.preventDefault();">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
            </button>
            <div></div>
            <!-- 왼쪽으로 -->
            <button class="bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white p-4 rounded-xl flex justify-center items-center shadow-lg active:scale-95 transition-transform touch-none" onmousedown="setDirection(-1, 0)" ontouchstart="setDirection(-1, 0); event.preventDefault();">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <!-- 아래로 -->
            <button class="bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white p-4 rounded-xl flex justify-center items-center shadow-lg active:scale-95 transition-transform touch-none" onmousedown="setDirection(0, 1)" ontouchstart="setDirection(0, 1); event.preventDefault();">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </button>
            <!-- 오른쪽으로 -->
            <button class="bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white p-4 rounded-xl flex justify-center items-center shadow-lg active:scale-95 transition-transform touch-none" onmousedown="setDirection(1, 0)" ontouchstart="setDirection(1, 0); event.preventDefault();">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7-7" /></svg>
            </button>
        </div>
        
        <!-- 하단 설명 -->
        <p class="text-center text-gray-500 text-xs mt-8">Github Pages 배포용 로컬 버전</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startScreen = document.getElementById('startScreen');
        const pointsIndicator = document.getElementById('pointsIndicator');
        const newRecordMsg = document.getElementById('newRecordMsg');

        // 게임 설정 (난이도별 데이터)
        const difficultySettings = {
            slow: { speed: 160, points: 5, minSpeed: 70, speedDrop: 5, headColor: '#0ea5e9', bodyColor: '#38bdf8' }, // 파란색
            normal: { speed: 110, points: 10, minSpeed: 45, speedDrop: 4, headColor: '#22c55e', bodyColor: '#4ade80' }, // 초록색
            fast: { speed: 65, points: 20, minSpeed: 25, speedDrop: 2, headColor: '#d946ef', bodyColor: '#e879f9' } // 보라색
        };

        const gridSize = 20;
        const tileCount = canvas.width / gridSize; // 400 / 20 = 20
        
        // 상태 변수
        let currentDifficulty = 'normal';
        let gameSpeed = difficultySettings[currentDifficulty].speed;
        let snake = [];
        let dx = 0, dy = 0;
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = 0;
        let foodEatenCount = 0; 
        let gameLoop;
        let isGameOver = false;
        let isGameStarted = false;
        let nextDx = 0, nextDy = 0;

        // 로컬 스토리지에서 최고 점수 불러오기
        function loadHighScore() {
            const savedScore = localStorage.getItem('snake_highscore');
            if (savedScore) {
                highScore = parseInt(savedScore, 10);
            }
            highScoreElement.innerText = highScore;
        }

        // 초기화
        function init() {
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            dx = 0; dy = 0; nextDx = 0; nextDy = 0;
            score = 0; foodEatenCount = 0;
            
            gameSpeed = difficultySettings[currentDifficulty].speed;
            
            scoreElement.innerText = score;
            isGameOver = false;
            isGameStarted = false;
            
            gameOverScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            newRecordMsg.classList.add('hidden');
            
            loadHighScore();
            updateDifficultyUI(); 
            spawnFood();
            draw();
        }

        // 난이도 설정
        function setDifficulty(level) {
            if (isGameStarted) return; // 게임 중 변경 불가
            currentDifficulty = level;
            updateDifficultyUI();
        }

        // 난이도 UI 업데이트
        function updateDifficultyUI() {
            const levels = ['slow', 'normal', 'fast'];
            levels.forEach(lvl => {
                const btn = document.getElementById(`btn-${lvl}`);
                if (lvl === currentDifficulty) {
                    btn.classList.add('bg-blue-600', 'text-white', 'shadow-md');
                    btn.classList.remove('text-gray-400', 'hover:bg-gray-700');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
                    btn.classList.add('text-gray-400', 'hover:bg-gray-700');
                }
                
                btn.disabled = isGameStarted; 
                if(isGameStarted) {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });

            pointsIndicator.innerText = `+${difficultySettings[currentDifficulty].points}점/개`;
        }

        // 게임 시작
        function startGame() {
            if (isGameStarted) return;
            isGameStarted = true;
            
            updateDifficultyUI();
            startScreen.classList.add('hidden');
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, gameSpeed);
        }

        // 게임 재시작
        function resetGame() {
            init();
        }

        // 매 프레임 업데이트 로직
        function update() {
            if (isGameOver) return;

            dx = nextDx; dy = nextDy;
            if (dx === 0 && dy === 0) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return gameOver();
            }

            // 자기 몸 충돌
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            // 먹이 확인
            if (head.x === food.x && head.y === food.y) {
                score += difficultySettings[currentDifficulty].points;
                scoreElement.innerText = score;
                
                // 현재 점수가 최고 점수를 넘으면 UI 즉시 업데이트 (효과용)
                if (score > highScore) {
                    highScoreElement.innerText = score;
                    highScoreElement.classList.add('text-red-400'); // 신기록 갱신 중 색상 변경
                }

                foodEatenCount++;
                
                const settings = difficultySettings[currentDifficulty];
                if (foodEatenCount % 5 === 0 && gameSpeed > settings.minSpeed) {
                    gameSpeed -= settings.speedDrop;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, gameSpeed);
                }
                
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        // 화면 그리기
        function draw() {
            ctx.fillStyle = '#030712'; // 배경
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 격자 무늬
            ctx.strokeStyle = '#1f2937';
            ctx.lineWidth = 0.5;
            for(let i=0; i<=tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }

            // 먹이
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 스네이크
            const currentColors = difficultySettings[currentDifficulty];
            for (let i = 0; i < snake.length; i++) {
                const isHead = i === 0;
                ctx.fillStyle = isHead ? currentColors.headColor : currentColors.bodyColor;
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, gridSize - 2, gridSize - 2);
                
                // 눈 그리기
                if (isHead) {
                    ctx.fillStyle = 'white';
                    let eye1X, eye1Y, eye2X, eye2Y;
                    const eyeSize = 3, offset = 5;

                    if (dx === 1) { eye1X = eye2X = snake[i].x * gridSize + gridSize - offset; eye1Y = snake[i].y * gridSize + offset; eye2Y = snake[i].y * gridSize + gridSize - offset; } 
                    else if (dx === -1) { eye1X = eye2X = snake[i].x * gridSize + offset; eye1Y = snake[i].y * gridSize + offset; eye2Y = snake[i].y * gridSize + gridSize - offset; } 
                    else if (dy === 1) { eye1Y = eye2Y = snake[i].y * gridSize + gridSize - offset; eye1X = snake[i].x * gridSize + offset; eye2X = snake[i].x * gridSize + gridSize - offset; } 
                    else { eye1Y = eye2Y = snake[i].y * gridSize + offset; eye1X = snake[i].x * gridSize + offset; eye2X = snake[i].x * gridSize + gridSize - offset; }

                    ctx.beginPath(); ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2); ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.beginPath(); ctx.arc(eye1X + dx, eye1Y + dy, 1.5, 0, Math.PI * 2); ctx.arc(eye2X + dx, eye2Y + dy, 1.5, 0, Math.PI * 2); ctx.fill();
                }
            }
        }

        // 먹이 랜덤 생성
        function spawnFood() {
            let isSafe = false;
            while (!isSafe) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
                isSafe = true;
                
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        isSafe = false; break;
                    }
                }
            }
        }

        // 게임 오버
        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            
            finalScoreElement.innerText = score;
            
            // 최고 기록 갱신 확인 및 저장
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                newRecordMsg.classList.remove('hidden'); // 신기록 메시지 표시
            }
            
            highScoreElement.classList.remove('text-red-400'); // 원래 색상으로 복구

            gameOverScreen.classList.remove('hidden');
            isGameStarted = false; 
            updateDifficultyUI();
        }

        // 방향 설정
        function setDirection(newDx, newDy) {
            if (isGameOver) return;
            if (!isGameStarted) startGame();

            // 반대 방향 방지 및 프레임 중복 방지
            if (dx !== 0 && newDx === -dx) return;
            if (dy !== 0 && newDy === -dy) return;
            if (dx === 0 && dy === 0 && newDy === 1) return;

            nextDx = newDx; nextDy = newDy;
        }

        // 키보드 컨트롤
        document.addEventListener('keydown', (e) => {
            // 방향키 누를 때 화면 스크롤 방지
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) > -1) {
                e.preventDefault();
            }
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); break;
                case 'ArrowDown': case 's': case 'S': setDirection(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); break;
            }
        });

        // 스와이프 (터치) 컨트롤
        let touchStartX = 0; let touchStartY = 0;
        const gameArea = document.getElementById('gameCanvas');

        gameArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            e.preventDefault();
        }, { passive: false });

        gameArea.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

        gameArea.addEventListener('touchend', (e) => {
            if (isGameOver) return;
            
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) {
                 if (!isGameStarted) startGame(); return;
            }

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) setDirection(1, 0); else setDirection(-1, 0);
            } else {
                if (diffY > 0) setDirection(0, 1); else setDirection(0, -1);
            }
            e.preventDefault();
        }, { passive: false });

        // 초기화 실행
        window.onload = init;

    </script>
</body>
</html>
